name: Check tracker data
on:
  pull_request:
  push:
    branches: [main]
    paths: ['tracker/**', 'tests/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/validate-data.mjs
